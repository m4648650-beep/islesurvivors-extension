<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IsleSurvivors Chat Bot</title>
<style>
  #game { width:400px;height:400px;background:lightgrey;position:relative;margin-top:20px; }
  #player { width:20px;height:20px;background:red;position:absolute;top:190px;left:190px; }
  #log { margin-top:10px;height:150px;overflow-y:auto;border:1px solid #ccc;padding:5px;font-family:monospace;background:#f5f5f5; }
</style>
</head>
<body>
<h2>IsleSurvivors Chat Bot</h2>
<div id="game"><div id="player"></div></div>
<div id="log"></div>

<!-- tmi.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/dist/tmi.min.js" defer></script>

<script defer>
document.addEventListener("DOMContentLoaded", () => {
  const client = new tmi.Client({
    identity: { username: 'islesurvivors', password: 'oauth:hj9uvvm431my7xqscvz9e5p39ifoi8' },
    channels: ['islesurvivors']
  });

  client.connect().then(() => console.log("Conectado a Twitch!"));

  const player = document.getElementById("player");
  let posX=190,posY=190;

  function moverJugador(comando) {
    const paso=10;
    if(comando==="!up") posY=Math.max(0,posY-paso);
    if(comando==="!down") posY=Math.min(380,posY+paso);
    if(comando==="!left") posX=Math.max(0,posX-paso);
    if(comando==="!right") posX=Math.min(380,posX+paso);
    player.style.left=posX+"px";
    player.style.top=posY+"px";
  }

  client.on('message',(channel,tags,message,self)=>{
    if(self) return;
    if(message.startsWith("!")) moverJugador(message.trim());
  });
});
</script>

</body>
</html>
