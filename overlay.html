<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>IsleSurvivors Overlay</title>

  <!-- Twitch Extension Helper -->
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
    }

    #playerName {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: bold;
      color: yellow;
      text-shadow: 1px 1px 3px black;
      opacity: 0;
      transition: opacity 0.5s;
    }

    button {
      margin-top: 10px;
      padding: 6px 12px;
      font-size: 14px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="panel">
    IsleSurvivors Overlay Github
    <br>
    <button id="simulate">Simular !jugar</button>
  </div>

  <div id="playerName"></div>

  <script>
    const playerName = document.getElementById('playerName');
    const simulateBtn = document.getElementById('simulate');

    // Mostrar jugador en pantalla
    function showPlayer(name) {
      playerName.textContent = name;
      playerName.style.opacity = '1';
      clearTimeout(window.hideTimer);
      window.hideTimer = setTimeout(() => {
        playerName.style.opacity = '0';
      }, 5000);
    }

    // Botón para simular !jugar
    simulateBtn.addEventListener('click', () => {
      showPlayer("JugadorSimulado");
    });

    // --- Twitch Extension Chat ---
    window.Twitch.ext.onAuthorized((auth) => {
      console.log("Ext autorizada", auth);

      // Conexión para escuchar PubSub o chat real (con extensiones se hace via onPubSub)
      window.Twitch.ext.listen('broadcast', (target, contentType, message) => {
        try {
          const data = JSON.parse(message);
          if (data.type === "jugar") {
            showPlayer(data.user);
          }
        } catch(e) { console.log(e); }
      });
    });

    // --- Para pruebas locales sin Twitch ---
    // Llamada directa: window.Twitch.ext.send("broadcast", JSON.stringify({type:"jugar", user:"ViewerX"}))
  </script>

</body>
</html>
