<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>IsleSurvivors Overlay</title>

  <!-- Twitch Extension Helper -->
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="panel">
    IsleSurvivors<br>
    Overlay cargado
  </div>

  <script>
    // Inicialización básica de la extensión
    window.Twitch.ext.onAuthorized(function(auth) {
      console.log("Ext autorizada", auth);
      document.getElementById("panel").innerHTML =
        "IsleSurvivors<br>Usuario autorizado";
    });
  </script>

</body>
</html>
